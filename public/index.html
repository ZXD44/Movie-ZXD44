<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Sync Movie - ดูหนังด้วยกัน</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#6366f1">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3658/3658937.png">
    <link
        href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600;800&family=Outfit:wght@400;600;800&display=swap"
        rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#f59e0b',
                        secondary: '#ea580c',
                        accent: '#facc15',
                        bg: '#020617',
                        cardBg: 'rgba(15, 23, 42, 1)',
                    },
                    fontFamily: {
                        sans: ['Outfit', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="/index.css">
    <style>
        .creation-box {
            position: fixed;
            bottom: 0;
            left: 50%;
            width: 100%;
            max-width: 500px;
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.98), rgba(2, 6, 23, 0.98));
            backdrop-filter: blur(25px);
            padding: 2rem 1.5rem 1.5rem;
            border-radius: 36px 36px 0 0;
            border-top: 2px solid var(--primary);
            border-left: 1px solid rgba(255, 255, 255, 0.05);
            border-right: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 -25px 60px rgba(0, 0, 0, 0.8), 0 0 40px rgba(245, 158, 11, 0.05);
            z-index: 1000;
            display: none;
            transform: translateX(-50%);
            opacity: 0;
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .creation-box.show {
            display: block;
            opacity: 1;
            transform: translateX(-50%) translateY(0);
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes slideUp {
            from { transform: translateX(-50%) translateY(100%); opacity: 0; }
            to { transform: translateX(-50%) translateY(0); opacity: 1; }
        }
    </style>
</head>

<body>
    <div id="statusMsg"
        class="fixed top-[25px] left-1/2 -translate-x-1/2 -translate-y-[100px] bg-gradient-to-br from-indigo-500/95 to-purple-500/95 text-white py-3 px-7 rounded-full text-sm font-bold z-[2000] flex items-center gap-3 shadow-[0_15px_35px_rgba(99,102,241,0.4)] backdrop-blur-md border border-white/20 pointer-events-none opacity-0">
        <span>✨</span> <span id="statusTxt"></span>
    </div>

    <div id="customPopup"
        class="fixed inset-0 bg-slate-900/40 backdrop-blur-md hidden justify-center items-center z-[2000] modal-overlay">
        <div
            class="bg-gradient-to-br from-slate-800/90 to-slate-900/95 border border-white/10 p-10 rounded-[32px] max-w-[420px] w-[90%] text-center shadow-[0_0_0_1px_rgba(255,255,255,0.05),0_20px_50px_-12px_rgba(0,0,0,0.5),0_0_40px_rgba(99,102,241,0.1)] relative overflow-hidden modal-content">
            <div class="absolute top-0 left-0 w-full h-[4px] bg-gradient-to-r from-primary to-secondary"></div>
            <div class="text-[3.5rem] mb-6 inline-block drop-shadow-[0_0_15px_rgba(99,102,241,0.3)] modal-icon"
                id="popupIcon">🔔</div>
            <div class="text-[1.75rem] font-extrabold mb-3 text-white tracking-tight" id="popupTitle">แจ้งเตือน</div>
            <div class="text-slate-400 mb-10 leading-relaxed text-[1.05rem]" id="popupText">ข้อความแจ้งเตือน</div>
            <button
                class="w-full bg-gradient-to-br from-primary to-secondary text-white p-4 rounded-xl text-base font-extrabold cursor-pointer transition-all hover:-translate-y-[2px] hover:shadow-[0_10px_25px_rgba(99,102,241,0.4)] hover:brightness-110 active:translate-y-0"
                onclick="closePopup()">รับทราบ ✨</button>
        </div>
    </div>

    <div class="fixed inset-0 z-[-1] overflow-hidden pointer-events-none">
        <div
            class="absolute top-[-10%] right-[-10%] w-[60%] h-[60%] bg-primary/10 rounded-full blur-[140px] animate-pulse">
        </div>
        <div class="absolute bottom-[-10%] left-[-10%] w-[50%] h-[50%] bg-yellow-500/5 rounded-full blur-[140px] animate-pulse"
            style="animation-delay: 2s;"></div>
    </div>

    <div class="max-w-[1100px] mx-auto px-4 sm:px-6 py-8 sm:py-12">
        <!-- 🎭 UI Header -->
        <header class="text-center mb-16 relative">
            <div class="inline-block relative">
                <h1 class="text-6xl sm:text-8xl font-black mb-4 tracking-tighter text-white bg-clip-text text-transparent bg-gradient-to-b from-white via-white to-slate-500 drop-shadow-[0_10px_30px_rgba(255,255,255,0.1)]"
                    style="font-family: 'Kanit', sans-serif;">
                    ดูหนังออนไลน์ฟรี
                </h1>
                <div class="absolute -top-4 -right-8 w-12 h-12 bg-primary/20 rounded-full blur-xl animate-bounce"></div>
            </div>
            <div class="mt-2 text-center">
                <div
                    class="inline-flex items-center gap-2 bg-white/5 backdrop-blur-md border border-white/10 px-6 py-2 rounded-full shadow-2xl">
                    <span class="w-2 h-2 bg-primary rounded-full animate-ping"></span>
                    <span class="text-[0.7rem] sm:text-[0.8rem] font-bold tracking-[0.2em] text-slate-300 uppercase">
                        BY <span class="text-white">ZXD44</span> • FREEMOVIE
                    </span>
                </div>
            </div>
        </header>

        <div class="max-w-[600px] mx-auto flex flex-col gap-5 mb-14">
            <div
                class="bg-slate-800/40 backdrop-blur-xl p-6 rounded-[28px] border border-white/10 shadow-[0_8px_30px_rgb(0,0,0,0.12)] relative overflow-hidden group">
                <div
                    class="absolute inset-x-0 bottom-0 h-1 bg-gradient-to-r from-primary to-secondary transform scale-x-0 group-hover:scale-x-100 transition-transform duration-500 origin-left">
                </div>
                <div class="flex items-center gap-5 relative z-10">
                    <div
                        class="w-14 h-14 bg-gradient-to-br from-indigo-500 to-purple-600 rounded-[20px] flex items-center justify-center text-2xl shadow-lg border border-white/10">
                        👤</div>
                    <div class="flex-1 flex flex-col gap-1.5">
                        <label for="userName"
                            class="text-[0.7rem] text-slate-400 font-bold uppercase tracking-widest ml-1">ผู้ใช้งานปัจจุบัน</label>
                        <input type="text" id="userName" placeholder="ตั้งชื่อเล่นของคุณที่นี่..."
                            class="bg-slate-900/50 border border-white/5 px-4 py-3 rounded-xl text-white outline-none w-full text-base font-medium transition-all focus:bg-slate-900/80 focus:border-primary placeholder:text-slate-600"
                            oninput="localStorage.setItem('zm_username', this.value.trim())">
                    </div>
                </div>
            </div>

            <div
                class="relative bg-gradient-to-br from-indigo-900/20 to-slate-900/40 backdrop-blur-xl rounded-[32px] border border-indigo-500/20 p-6 flex sm:flex-row flex-col items-center justify-between gap-6 transition-all group overflow-hidden">
                <div
                    class="absolute -top-10 -right-10 w-32 h-32 bg-indigo-500/10 rounded-full blur-3xl group-hover:bg-indigo-500/20 transition-all">
                </div>

                <div class="flex items-center gap-5 text-left w-full sm:w-auto relative z-10">
                    <div
                        class="w-14 h-14 bg-gradient-to-br from-indigo-500/20 to-purple-500/20 rounded-2xl flex items-center justify-center text-2xl border border-white/5 flex-shrink-0 shadow-inner">
                        🛡️</div>
                    <div>
                        <div class="text-white font-extrabold text-base sm:text-lg tracking-tight">แนะนำให้ติดตั้ง
                            AdBlocker</div>
                        <div class="text-slate-400 text-xs sm:text-sm leading-relaxed">
                            เพื่อกำจัดป๊อปอัพโฆษณาที่แทรกจากเว็บวิดีโอต้นทาง</div>
                    </div>
                </div>

                <button
                    class="relative z-10 w-full sm:w-auto bg-indigo-500 text-white px-7 py-3 rounded-2xl text-sm font-extrabold cursor-pointer hover:scale-105 hover:shadow-[0_10px_20px_rgba(99,102,241,0.3)] active:scale-95 transition-all whitespace-nowrap overflow-hidden"
                    onclick="showAdblockPopup()">
                    ติดตั้งอย่างไร? 🚀
                </button>
            </div>
        </div>

        <div class="rooms-section mb-12">
            <div class="flex items-center justify-between mb-4">
                <h2 class="text-2xl font-extrabold flex items-center gap-3">
                    <span class="text-2xl">🏠</span> ห้องที่เปิดอยู่
                </h2>
                <button onclick="loadRooms()"
                    class="flex items-center gap-2 bg-slate-800 border border-white/10 text-slate-300 font-bold px-4 py-2 rounded-xl text-sm hover:bg-slate-700 hover:text-white transition-all">
                    <span class="text-primary">🔄</span> รีเฟรช
                </button>
            </div>
            <div id="activeRooms" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6 mt-4"></div>
        </div>

        <div class="flex flex-col sm:flex-row gap-4 mb-8 glass p-4 rounded-3xl border border-white/5">
            <input type="text" id="movieSearch"
                class="flex-1 min-w-[200px] bg-slate-800 border border-white/10 px-4 py-3 rounded-xl text-white outline-none focus:border-primary"
                placeholder="🔍 ค้นหาหนัง..." oninput="debounceSearch()">
            <select id="genreFilter"
                class="flex-1 min-w-[200px] bg-slate-800 border border-white/10 px-4 py-3 rounded-xl text-white outline-none focus:border-primary"
                onchange="filterLocal()">
                <option value="">🎭 ทุกหมวดหมู่</option>
                <option value="doonung/action-movie">💥 Action</option>
                <option value="doonung/horror-ghost-movie">👻 Horror</option>
                <option value="doonung/comedy-movie">😂 Comedy</option>
                <option value="doonung/animation">🎬 Animation</option>
            </select>
        </div>

        <div class="mb-4 flex justify-between text-slate-400 text-sm px-2">
            <span id="movieCount">กำลังโหลด...</span>
            <span class="opacity-60">*คลิกที่รูปเพื่อเลือกหนัง</span>
        </div>

        <div id="movieGrid"
            class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6 sm:gap-10 mb-12 items-start"></div>
        <div id="loadMore" class="text-center p-8 text-slate-400">เลื่อนลงเพื่อโหลดต่อ ✨</div>

        <div id="selectedMovieArea" class="creation-box">
            <button class="close-btn"
                onclick="document.getElementById('selectedMovieArea').classList.remove('show')">✕</button>
            <div class="flex gap-6 items-start mb-8 pb-4 border-b border-white/5">
                <div class="relative group">
                    <img id="selPoster" src=""
                        class="w-[100px] h-[150px] rounded-2xl object-cover shadow-2xl border border-white/10 group-hover:scale-105 transition-transform duration-300">
                    <div class="absolute -bottom-2 -right-2 bg-primary text-black text-[0.6rem] font-black px-2 py-0.5 rounded-md shadow-lg">PREMIUM</div>
                </div>
                <div class="text-left flex-1 min-w-0">
                    <div class="text-[0.7rem] text-primary font-black uppercase tracking-[0.2em] mb-2 leading-none flex items-center gap-1.5">
                        <span class="w-1.5 h-1.5 bg-primary rounded-full"></span> MOVIE SELECTED
                    </div>
                    <h3 id="selTitle" class="text-2xl font-black mb-4 line-clamp-2 text-white leading-tight" style="font-family: 'Kanit', sans-serif;">ชื่อหนัง</h3>
                    <div class="user-input-wrapper space-y-2">
                        <label for="rName"
                            class="text-[0.65rem] text-slate-400 font-bold uppercase tracking-widest ml-1">ตั้งชื่อห้องรับชม 🎬</label>
                        <input type="text" id="rName" placeholder="เช่น 'ห้องนั่งเล่นสุดเท่...'"
                            class="w-full bg-slate-900/80 border border-white/10 px-5 py-3 rounded-2xl text-white font-bold text-sm outline-none focus:border-primary focus:ring-4 focus:ring-primary/10 transition-all">
                    </div>
                </div>
            </div>
            <button id="createRoomBtn" onclick="createRoom()"
                class="w-full bg-gradient-to-r from-primary via-secondary to-accent text-black font-black text-lg py-5 rounded-2xl shadow-[0_15px_35px_rgba(245,158,11,0.25)] hover:-translate-y-1.5 active:translate-y-0 transition-all flex items-center justify-center gap-3">
                <span class="text-2xl">🔥</span> เริ่มสร้างห้องและรับชมเลย
            </button>
        </div>
    </div>

    <script src="/movies-api.js"></script>
    <script src="/index.js"></script>
</body>

</html>
