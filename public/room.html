<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ดูหนังออนไลน์ฟรี - คนทำเว็บ ZXD44</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#020617">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3658/3658937.png">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <link rel="stylesheet" href="/room.css">
</head>

<body>
    <div id="statusMsg" style="position:fixed; top:20px; left:50%; transform:translateX(-50%); z-index:4000; opacity:0; transition:all 0.3s;">
        <div style="background: var(--primary); padding: 12px 24px; border-radius: 99px; box-shadow: 0 10px 30px var(--primary-glow); font-weight: 700;" id="statusTxt">Status Message</div>
    </div>

    <!-- Modals -->
    <div id="customPopup" class="modal-overlay">
        <div class="modal-card">
            <div id="popupIcon" style="font-size: 4rem; margin-bottom: 1.5rem;">✨</div>
            <h2 id="popupTitle" style="margin-bottom: 0.75rem;">Notification</h2>
            <p id="popupText" style="color: var(--text-dim); margin-bottom: 2rem; line-height: 1.6;">Message content goes here.</p>
            <button id="popupOkBtn" class="action-btn" onclick="closePopup()" style="width:100%; justify-content:center; background: var(--primary); border:none; padding:16px;">ตกลง</button>
        </div>
    </div>

    <div class="header">
        <div class="header-logo">
            <div style="width: 40px; height: 40px; background: linear-gradient(135deg, var(--primary), var(--secondary)); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 1.4rem; box-shadow: 0 8px 16px var(--primary-glow);">🎬</div>
            <div class="room-info">
                <span class="room-name" id="roomDisplay">Premium Room</span>
                <span class="movie-title">
                    <span id="lockStatusUI">🔓</span> 
                    <span id="movieDisplay">Standby...</span>
                </span>
            </div>
        </div>

        <div class="header-actions">
            <div class="user-pill" onclick="showParticipants()">
                 <span id="uCount">1</span> <span style="opacity:0.6">คน</span>
            </div>
            <button class="action-btn" onclick="shareRoom()" style="background: rgba(34, 197, 94, 0.12); color: #4ade80; border: 1px solid rgba(34, 197, 94, 0.3); box-shadow: none;">
                📤 <span class="hide-mobile">แชร์ห้อง</span>
            </button>
            <div style="position:relative;">
                <button class="btn-icon btn-primary" onclick="toggleMenu()" style="border-radius: 14px;">⚙️</button>
                <div id="roomMenu" style="position:absolute; top:120%; right:0; width:220px; background:#1e293b; border:1px solid var(--border); border-radius:18px; display:none; flex-direction:column; overflow:hidden; box-shadow:0 10px 30px rgba(0,0,0,0.5); z-index:2000;">
                    <div id="lockControlArea" style="padding:16px; border-bottom:1px solid var(--border); display:none; justify-content:space-between; align-items:center;">
                        <span style="font-size:0.85rem; font-weight:700;">🔐 ล็อคห้อง</span>
                        <label class="toggle-switch">
                            <input type="checkbox" id="lockToggle" onchange="toggleLock()">
                            <span class="slider"></span>
                        </label>
                    </div>
                    <button class="menu-item" onclick="showAdblockPopup()" style="padding:14px 16px; text-align:left; background:none; border:none; color:white; cursor:pointer;">🛡️ AdBlocker</button>
                    <button class="menu-item" onclick="location.reload()" style="padding:14px 16px; text-align:left; background:none; border:none; color:white; cursor:pointer;">🔄 รีเฟรช</button>
                    <button id="switchSourceBtn" class="menu-item" style="display:none; padding:14px 16px; text-align:left; background:none; border:none; color:white; cursor:pointer;" onclick="showSourcePicker()">🎬 สลับแหล่งสำรอง</button>
                    <button id="closeRoomBtn" class="menu-item" style="display:none; padding:14px 16px; text-align:left; background:none; border:none; color:var(--danger); cursor:pointer;" onclick="closeRoom()">🗑️ ลบห้องถาวร</button>
                    <button class="menu-item" onclick="window.location.href='/'" style="padding:14px 16px; text-align:left; background:none; border:none; color:var(--danger); border-top:1px solid var(--border); cursor:pointer;">🚪 ออกไปหน้าหลัก</button>
                </div>
            </div>
        </div>
    </div>

    <div class="main-container">
        <div class="content-area">
            <div class="player-card" id="playerWrapper">
                <div id="emojiLayer" style="position:absolute; inset:0; pointer-events:none; z-index:100; overflow:hidden;"></div>
                <div id="playerContent" style="width:100%; height:100%;">
                    <video id="vPlayer" controls playsinline style="width:100%; height:100%;">
                        <source id="vSource" src="" type="video/mp4">
                    </video>
                </div>
            </div>
            
            <div style="background:var(--card-bg); border-radius:20px; padding:1rem; border:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; opacity:0.8;">
                <div style="display:flex; align-items:center; gap:12px;">
                    <span style="font-size:1.5rem;">🍿</span>
                    <span style="font-size:0.85rem; color:var(--text-dim);">ขอให้สนุกกับการดูหนังแชร์หน้าจอกับเพื่อนๆ นะครับ! ตัวใครตัวมันดูได้ตามสบายเลย</span>
                </div>
            </div>
        </div>

        <div class="sidebar">
            <div class="chat-card">
                <div class="chat-header">
                    <div class="chat-title">💬 แชทกลุ่มพรีเมียม</div>
                    <div style="font-size:0.7rem; color:var(--accent); font-weight:800; background:rgba(34,197,94,0.1); padding:4px 8px; border-radius:6px;">LIVE ONLINE</div>
                </div>
                
                <div id="chatBox" class="chat-messages">
                    <!-- Messages will appear here -->
                </div>

                <div class="emoji-blast-bar">
                    <button class="mini-emoji-btn" onclick="blastEmoji('❤️')">❤️</button>
                    <button class="mini-emoji-btn" onclick="blastEmoji('😂')">😂</button>
                    <button class="mini-emoji-btn" onclick="blastEmoji('😮')">😮</button>
                    <button class="mini-emoji-btn" onclick="blastEmoji('🔥')">🔥</button>
                    <button class="mini-emoji-btn" onclick="blastEmoji('👍')">👍</button>
                </div>

                <div class="chat-input-wrapper">
                    <div class="chat-input-area">
                        <input type="text" id="chatIn" placeholder="พิมพ์คุยกับเพื่อนที่นี่...">
                        <button class="btn-icon btn-primary" onclick="sendChat()">🚀</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/room.js"></script>
</body>
</html>
